name: wave-776-apply
permissions:
  contents: write
on:
  workflow_dispatch:
    inputs:
      patch_url:
        required: true
        type: string
      patch_sha256:
        required: true
        type: string
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch patch
        env:
          PATCH_URL: ${{ inputs.patch_url }}
          PATCH_SHA256: ${{ inputs.patch_sha256 }}
        run: |
          curl -fsSL "$PATCH_URL" -o /tmp/776.patch
          echo "$PATCH_SHA256  /tmp/776.patch" | sha256sum -c -
      - name: Checkout upstream main
        run: |
          git fetch --no-tags https://github.com/sorolens/sorolens main:refs/remotes/upstream/main
          git checkout -B clean upstream/main
      - name: Apply patch
        run: git apply --whitespace=nowarn /tmp/776.patch
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Regenerate Go client
        working-directory: packages/go-client
        run: |
          go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.4.1
          oapi-codegen --config oapi-codegen.yaml ../../docs/openapi.yaml
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate Python client
        run: bash packages/python-sdk/scripts/generate_client.sh
      - name: Commit and push
        run: |
          git config user.name "jdegen808"
          git config user.email "jdegen808@users.noreply.github.com"
          git add -A
          git commit -m "fix(api): bound list pages, validate query params and cache global stats (#776)"
          git push --force origin HEAD:fix/776-list-limits-stats
