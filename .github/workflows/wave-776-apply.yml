name: wave-776-apply

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebase the #776 branch onto upstream main as one commit
        env:
          BRANCH: fix/776-list-limits-stats
        run: |
          set -euo pipefail
          git config user.name jdegen808
          git config user.email jdegen808@users.noreply.github.com
          git fetch origin "$BRANCH"
          tip="$(git rev-parse FETCH_HEAD)"
          git fetch --no-tags https://github.com/sorolens/sorolens main:refs/remotes/upstream/main
          upstream="$(git rev-parse refs/remotes/upstream/main)"
          git checkout -B clean "$upstream"
          git checkout "$tip" -- .
          git commit -m "fix(api): bound list pages, validate query params and cache global stats (#776)"
          if [ "$(git rev-parse HEAD^{tree})" != "$(git rev-parse "$tip^{tree}")" ]; then
            echo "tree mismatch" >&2
            exit 1
          fi
          git push --force origin clean:refs/heads/"$BRANCH"
          git log --oneline -2
          git show --stat --oneline HEAD
